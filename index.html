<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Split · trips &amp; receipts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F0; --paper-dark:#F0EAD8; --ink:#211E1A; --ink-soft:#6B6558;
    --line:#D9D1BC; --stamp-red:#B7392F; --stamp-blue:#2C4A6E; --radius:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:#E7E0CC; font-family:'Manrope',sans-serif; color:var(--ink); min-height:100vh;
    display:flex; justify-content:center; padding:28px 12px 60px; }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  .receipt{ width:100%; max-width:460px; background:var(--paper); position:relative;
    box-shadow:0 18px 40px -14px rgba(33,30,26,0.35); }
  .zigzag-top{ height:14px; background:
      linear-gradient(-45deg, transparent 8px, var(--paper) 8px) 0 0,
      linear-gradient(45deg, transparent 8px, var(--paper) 8px) 0 0;
    background-size:16px 14px; background-repeat:repeat-x; background-position:bottom; }
  .zigzag-bottom{ height:14px; background:
      linear-gradient(-135deg, transparent 8px, var(--paper) 8px) 0 100%,
      linear-gradient(135deg, transparent 8px, var(--paper) 8px) 0 100%;
    background-size:16px 14px; background-repeat:repeat-x; background-position:top; }

  .body-pad{ padding:8px 26px 26px; min-height:200px; }

  header.masthead{ text-align:center; padding-top:14px; padding-bottom:16px; border-bottom:1px dashed var(--line); }
  header.masthead .title{ font-family:'Space Mono',monospace; font-weight:700; font-size:26px; letter-spacing:2px; text-transform:uppercase; }
  header.masthead .sub{ font-size:11px; letter-spacing:1.5px; color:var(--ink-soft); text-transform:uppercase; margin-top:4px; }

  .navbar{ display:flex; align-items:center; gap:10px; padding:14px 0 4px; }
  .navbar .back{ background:none;border:none;font-family:'Space Mono',monospace;font-size:13px;color:var(--stamp-blue);cursor:pointer;padding:4px 0; font-weight:700; }
  .navbar .nav-title{ font-family:'Space Mono',monospace; font-weight:700; font-size:14px; letter-spacing:1px; flex:1; text-transform:uppercase; text-align:center; }
  .navbar .nav-action{ background:none;border:none;color:var(--stamp-red);font-size:15px;cursor:pointer; font-weight:700;}

  section{ padding:16px 0; border-bottom:1px dashed var(--line); }
  section:last-of-type{ border-bottom:none; }
  .label-row{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }

  /* generic cards */
  .trip-card, .receipt-card{ border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px;
    margin-bottom:9px; cursor:pointer; background:var(--paper); transition:border-color .12s ease; }
  .trip-card:active, .receipt-card:active{ border-color:var(--ink-soft); }
  .card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .card-title{ font-weight:800; font-size:14px; }
  .card-amount{ font-family:'Space Mono',monospace; font-weight:700; font-size:14px; white-space:nowrap; }
  .card-sub{ font-size:11px; color:var(--ink-soft); margin-top:4px; font-family:'Space Mono',monospace; }
  .card-badges{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .badge{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; color:#fff; }
  .badge.outline{ background:none; border:1px solid var(--line); color:var(--ink-soft); }

  .new-btn{ width:100%; padding:12px; background:var(--ink); color:var(--paper); border:none; border-radius:var(--radius);
    font-family:'Space Mono',monospace; font-weight:700; font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    cursor:pointer; margin-top:2px; }
  .new-btn:active{ transform:translateY(1px); }

  .inline-form{ display:flex; gap:8px; margin-bottom:14px; }
  .inline-form input{ flex:1; border:1px solid var(--line); border-radius:20px; padding:9px 14px; font-size:13px;
    font-family:'Manrope',sans-serif; background:var(--paper); min-width:0; }
  .inline-form input:focus{ outline:none; border-color:var(--ink-soft); }
  .inline-form button{ border:none; background:var(--ink); color:var(--paper); border-radius:20px; padding:9px 16px;
    font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }

  .empty-note{ font-size:12px; color:var(--ink-soft); font-style:italic; }

  /* participants */
  .people-strip{ display:flex; flex-wrap:wrap; gap:8px; }
  .person-chip{ display:flex; align-items:center; gap:7px; padding:6px 10px 6px 6px; border-radius:20px;
    background:var(--paper-dark); font-size:13px; font-weight:700; }
  .avatar{ width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff; font-size:11px; font-weight:800; font-family:'Manrope',sans-serif; flex-shrink:0; }
  .avatar.sm{ width:20px;height:20px;font-size:9px; }
  .person-chip .rm{ background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;line-height:1;padding:0; }

  /* capture */
  .slot{ display:block; border:2px dashed var(--ink-soft); border-radius:var(--radius); padding:20px 14px; text-align:center; cursor:pointer;
    background:repeating-linear-gradient(135deg, transparent, transparent 8px, #21181120 8px, #21181120 9px); }
  .slot .icon{ font-size:26px; }
  .slot .txt{ font-size:13px; font-weight:600; margin-top:6px; }
  .slot .sub{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  input[type=file]{ display:none; }
  .thumb-wrap{ display:flex; gap:10px; align-items:center; margin-top:12px; }
  .thumb-wrap img{ width:52px; height:52px; object-fit:cover; border:1px solid var(--line); }
  .thumb-wrap .info{ font-size:12px; color:var(--ink-soft); flex:1; }
  .btn-text{ background:none; border:none; font-family:'Manrope',sans-serif; font-size:12px; font-weight:700;
    color:var(--stamp-blue); cursor:pointer; padding:4px 0; text-decoration:underline; }
  .status-line{ font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); margin-top:10px; }
  .dots::after{ content:''; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots{ 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
  .error-line{ font-family:'Space Mono',monospace; font-size:12px; color:var(--stamp-red); margin-top:10px; }

  /* fields */
  .field-row{ margin-bottom:13px; }
  .field-row label{ display:block; font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:1px; color:var(--ink-soft); margin-bottom:5px; }
  .field-row input[type=text], .field-row input[type=date]{ width:100%; border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 10px; font-family:'Manrope',sans-serif; font-size:13px; background:var(--paper); }
  .field-row input:focus{ outline:none; border-color:var(--ink-soft); }

  /* mode toggle */
  .mode-toggle{ display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; margin-bottom:14px; }
  .mode-toggle button{ flex:1; padding:9px; background:var(--paper); border:none; font-family:'Manrope',sans-serif;
    font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .mode-toggle button.active{ background:var(--ink); color:var(--paper); }

  /* items (itemized mode) */
  .item-row{ margin-bottom:14px; }
  .item-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .item-name{ font-family:'Space Mono',monospace; font-size:14px; background:transparent; border:none;
    border-bottom:1px solid transparent; color:var(--ink); flex:1; padding:2px 0; min-width:0; }
  .item-name:focus{ outline:none; border-bottom:1px solid var(--ink-soft); }
  .item-price{ font-family:'Space Mono',monospace; font-size:14px; background:transparent; border:none;
    border-bottom:1px solid transparent; color:var(--ink); width:66px; text-align:right; padding:2px 0; }
  .item-price:focus{ outline:none; border-bottom:1px solid var(--ink-soft); }
  .item-del{ background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:0 0 0 4px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .chip{ font-family:'Manrope',sans-serif; font-size:11px; font-weight:700; padding:4px 10px 4px 8px; border-radius:20px;
    border:1.5px solid var(--line); background:transparent; cursor:pointer; display:flex; align-items:center; gap:5px;
    color:var(--ink-soft); }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.4; }
  .chip.active{ color:#fff; border-color:transparent; }
  .chip.active .dot{ background:#fff; opacity:1; }
  .add-item-btn{ width:100%; padding:10px; background:none; border:1px dashed var(--line); color:var(--ink-soft);
    font-family:'Manrope',sans-serif; font-size:12px; font-weight:700; cursor:pointer; border-radius:var(--radius); margin-top:4px; }

  .tt-row{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-family:'Space Mono',monospace; font-size:13px; }
  .tt-row input{ width:80px; text-align:right; border:none; border-bottom:1px solid var(--line); background:transparent;
    font-family:'Space Mono',monospace; font-size:13px; color:var(--ink); padding:2px 0; }
  .tt-row input:focus{ outline:none; border-bottom-color:var(--ink); }
  .tt-row.total{ font-weight:700; font-size:15px; border-top:1px dashed var(--line); margin-top:6px; padding-top:10px; }

  /* even split amount field */
  .amt-field{ display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:20px; font-weight:700; }
  .amt-field span{ color:var(--ink-soft); }
  .amt-field input{ border:none; border-bottom:2px solid var(--line); background:transparent; font-family:'Space Mono',monospace;
    font-size:20px; font-weight:700; color:var(--ink); width:120px; padding:2px 0; }
  .amt-field input:focus{ outline:none; border-bottom-color:var(--ink); }
  .per-head-note{ font-size:11px; color:var(--ink-soft); margin-top:8px; font-family:'Space Mono',monospace; }

  .save-btn{ width:100%; padding:15px; background:var(--ink); color:var(--paper); border:none; cursor:pointer;
    font-family:'Space Mono',monospace; font-weight:700; font-size:13px; letter-spacing:2px; text-transform:uppercase;
    border-radius:var(--radius); }
  .save-btn:active{ transform:translateY(1px); }
  .validation{ font-family:'Space Mono',monospace; font-size:11px; color:var(--stamp-red); margin-top:8px; text-align:center; }
  .delete-receipt{ width:100%; padding:10px; background:none; border:1px solid var(--line); color:var(--stamp-red);
    font-family:'Manrope',sans-serif; font-size:12px; font-weight:700; cursor:pointer; border-radius:var(--radius); margin-top:10px; }

  /* summary */
  .balance-row{ display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid var(--paper-dark); }
  .balance-row:last-child{ border-bottom:none; }
  .balance-name{ font-weight:700; font-size:13px; flex:1; }
  .balance-sub{ font-size:10px; color:var(--ink-soft); font-family:'Space Mono',monospace; }
  .balance-amt{ font-family:'Space Mono',monospace; font-weight:700; font-size:13px; text-align:right; }
  .balance-amt.pos{ color:var(--stamp-blue); }
  .balance-amt.neg{ color:var(--stamp-red); }
  .settle-block{ margin-top:4px; }
  .settle-row{ font-family:'Space Mono',monospace; font-size:12px; padding:7px 0; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .settle-row .arrow{ color:var(--ink-soft); }

  .barcode{ height:30px; background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px); margin-top:16px; opacity:.85; }
  .thanks{ text-align:center; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--ink-soft); margin-top:8px; text-transform:uppercase; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="receipt">
  <div class="zigzag-top"></div>
  <div class="body-pad">

    <header class="masthead" id="masthead">
      <div class="title">Split</div>
      <div class="sub">trips, shared with friends</div>
    </header>

    <div class="navbar hidden" id="navbar">
      <button class="back" id="navBack">‹ Back</button>
      <div class="nav-title" id="navTitle"></div>
      <button class="nav-action hidden" id="navDelete">Delete</button>
    </div>

    <!-- ===== SCREEN: TRIPS LIST ===== -->
    <div id="screen-trips">
      <section>
        <div class="label-row"><span>new trip</span></div>
        <div class="inline-form">
          <input type="text" id="newTripInput" placeholder="e.g. Boracay 2026" maxlength="40">
          <button id="newTripBtn">Create</button>
        </div>
      </section>
      <section>
        <div class="label-row"><span>your trips</span></div>
        <div id="tripsList"></div>
      </section>
    </div>

    <!-- ===== SCREEN: TRIP DETAIL ===== -->
    <div id="screen-trip" class="hidden">
      <section>
        <div class="label-row"><span>families / people</span></div>
        <div class="people-strip" id="participantsStrip"></div>
        <div class="inline-form" style="margin-top:12px;">
          <input type="text" id="newParticipantInput" placeholder="e.g. The Reyes Family" maxlength="24">
          <button id="newParticipantBtn">Add</button>
        </div>
      </section>

      <section>
        <div class="label-row"><span>receipts</span></div>
        <div id="receiptsList"></div>
        <button class="new-btn" id="newReceiptBtn">+ Add a receipt</button>
      </section>

      <section>
        <div class="label-row"><span>who owes what</span></div>
        <div id="balancesList"></div>
        <div class="settle-block" id="settleBlock"></div>
      </section>
    </div>

    <!-- ===== SCREEN: RECEIPT EDITOR ===== -->
    <div id="screen-receipt" class="hidden">
      <section>
        <div class="label-row"><span>the receipt</span></div>
        <label id="slot" class="slot" for="fileInput">
          <div class="icon">🧾</div>
          <div class="txt">Tap to photograph or upload</div>
          <div class="sub">Optional — you can also enter everything by hand</div>
        </label>
        <input type="file" id="fileInput" accept="image/*">
        <div id="thumbArea" class="hidden">
          <div class="thumb-wrap">
            <img id="thumbImg" alt="Receipt preview">
            <div class="info" id="thumbInfo">Ready to read.</div>
            <label class="btn-text" id="retakeBtn" for="fileInput">Retake</label>
          </div>
        </div>
        <div id="statusLine" class="status-line hidden"><span id="statusText">Reading receipt<span class="dots"></span></span></div>
        <div id="errorLine" class="error-line hidden"></div>
      </section>

      <section>
        <div class="field-row">
          <label>Label</label>
          <input type="text" id="receiptLabel" placeholder="e.g. Groceries — Day 2" maxlength="50">
        </div>
        <div class="field-row">
          <label>Date</label>
          <input type="date" id="receiptDate">
        </div>
        <div class="field-row">
          <label>Paid by</label>
          <div class="people-strip" id="paidByStrip"></div>
        </div>
      </section>

      <section>
        <div class="mode-toggle">
          <button id="modeItemizedBtn" class="active">Assign items</button>
          <button id="modeEvenBtn">Split evenly</button>
        </div>

        <div id="itemizedBlock">
          <div id="itemsList"></div>
          <button class="add-item-btn" id="addItemBtn">+ add item by hand</button>
          <div class="tt-row"><span>Subtotal</span><span id="subtotalDisplay">£0.00</span></div>
          <div class="tt-row"><span>Tax</span><input type="number" id="taxInput" step="0.01" min="0" value="0"></div>
          <div class="tt-row"><span>Tip</span><input type="number" id="tipInput" step="0.01" min="0" value="0"></div>
          <div class="tt-row total"><span>Total</span><span id="itemizedTotalDisplay">£0.00</span></div>
        </div>

        <div id="evenBlock" class="hidden">
          <div class="label-row" style="margin-bottom:8px;"><span>split between</span></div>
          <div class="people-strip" id="evenParticipantsStrip"></div>
          <div class="field-row" style="margin-top:16px;">
            <label>Total amount</label>
            <div class="amt-field"><span>£</span><input type="number" id="evenTotalInput" step="0.01" min="0" placeholder="0.00"></div>
          </div>
          <div class="per-head-note" id="perHeadNote"></div>
        </div>
      </section>

      <section>
        <button class="save-btn" id="saveReceiptBtn">Save receipt</button>
        <div class="validation hidden" id="validationMsg"></div>
        <button class="delete-receipt hidden" id="deleteReceiptBtn">Delete this receipt</button>
      </section>
    </div>

    <div class="barcode"></div>
    <div class="thanks">thanks for dining together</div>
  </div>
  <div class="zigzag-bottom"></div>
</div>

<script>
const PALETTE = ['#B7392F','#2C4A6E','#4A7C59','#8C5E2A','#6B4B8A','#B08A2E','#4A6E6E','#8A3E5E'];
const STORAGE_KEY = 'split_trips_v1';
const $ = (id) => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = (n) => '£' + (Math.round((n+Number.EPSILON)*100)/100).toFixed(2);

// ---------- STATE ----------
let trips = [];
let currentTripId = null;
let currentReceiptId = null; // null = creating a new receipt
let draftReceipt = null;     // working copy while editing
let receiptImageB64 = null, receiptImageMedia = null;

function loadTrips(){
  try{ trips = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ trips = []; }
}
function saveTrips(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)); }catch(e){} }
function getTrip(id){ return trips.find(t=>t.id===id); }

loadTrips();

// ---------- NAVIGATION ----------
function showScreen(name){
  ['screen-trips','screen-trip','screen-receipt'].forEach(id=>$(id).classList.add('hidden'));
  $(name).classList.remove('hidden');
  $('masthead').classList.toggle('hidden', name!=='screen-trips');
  $('navbar').classList.toggle('hidden', name==='screen-trips');
  $('navDelete').classList.add('hidden');
  if(name==='screen-trip'){
    $('navTitle').textContent = getTrip(currentTripId)?.name || '';
    $('navDelete').classList.remove('hidden');
    $('navDelete').onclick = deleteCurrentTrip;
    $('navBack').onclick = ()=>{ currentTripId=null; renderTripsScreen(); showScreen('screen-trips'); };
  }
  if(name==='screen-receipt'){
    $('navTitle').textContent = currentReceiptId ? 'Edit receipt' : 'New receipt';
    if(currentReceiptId){ $('navDelete').classList.remove('hidden'); $('navDelete').onclick = deleteCurrentReceipt; }
    $('navBack').onclick = ()=>{ renderTripScreen(); showScreen('screen-trip'); };
  }
}

// ================= TRIPS LIST =================
function renderTripsScreen(){
  const list = $('tripsList');
  list.innerHTML = '';
  if(trips.length===0){
    list.innerHTML = '<div class="empty-note">No trips yet — create one above to start tracking receipts together.</div>';
    return;
  }
  trips.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(trip=>{
    const total = trip.receipts.reduce((s,r)=>s+(r.total||0),0);
    const card = document.createElement('div');
    card.className = 'trip-card';
    card.innerHTML = `
      <div class="card-top">
        <span class="card-title">${escapeHtml(trip.name)}</span>
        <span class="card-amount">${fmt(total)}</span>
      </div>
      <div class="card-sub">${trip.participants.length} ${trip.participants.length===1?'family':'families'} · ${trip.receipts.length} receipt${trip.receipts.length===1?'':'s'}</div>
    `;
    card.addEventListener('click', ()=>{ currentTripId = trip.id; renderTripScreen(); showScreen('screen-trip'); });
    list.appendChild(card);
  });
}

$('newTripBtn').addEventListener('click', ()=>{
  const name = $('newTripInput').value.trim();
  if(!name) return;
  const trip = { id:uid(), name, createdAt:Date.now(), participants:[], receipts:[] };
  trips.push(trip);
  $('newTripInput').value = '';
  saveTrips();
  renderTripsScreen();
});
$('newTripInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('newTripBtn').click(); } });

function deleteCurrentTrip(){
  if(!confirm('Delete this trip and all its receipts?')) return;
  trips = trips.filter(t=>t.id!==currentTripId);
  saveTrips();
  currentTripId = null;
  renderTripsScreen();
  showScreen('screen-trips');
}

// ================= TRIP DETAIL =================
function renderTripScreen(){
  const trip = getTrip(currentTripId);
  if(!trip) return;
  $('navTitle').textContent = trip.name;

  // participants
  const pStrip = $('participantsStrip');
  pStrip.innerHTML = '';
  if(trip.participants.length===0){
    pStrip.innerHTML = '<div class="empty-note">Add each family or person joining this trip.</div>';
  }
  trip.participants.forEach(p=>{
    const chip = document.createElement('div');
    chip.className = 'person-chip';
    chip.innerHTML = `<span class="avatar" style="background:${p.color}">${initials(p.name)}</span>${escapeHtml(p.name)}`;
    const rm = document.createElement('button');
    rm.className='rm'; rm.textContent='✕';
    rm.addEventListener('click', ()=>{
      trip.participants = trip.participants.filter(x=>x.id!==p.id);
      trip.receipts.forEach(r=>{
        r.items.forEach(it => it.assignedTo = it.assignedTo.filter(id=>id!==p.id));
        r.evenParticipants = (r.evenParticipants||[]).filter(id=>id!==p.id);
        if(r.paidBy===p.id) r.paidBy = null;
        recomputeReceipt(r);
      });
      saveTrips(); renderTripScreen();
    });
    chip.appendChild(rm);
    pStrip.appendChild(chip);
  });

  // receipts
  const rList = $('receiptsList');
  rList.innerHTML = '';
  if(trip.receipts.length===0){
    rList.innerHTML = '<div class="empty-note">No receipts yet.</div>';
  }
  trip.receipts.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(r=>{
    const payer = trip.participants.find(p=>p.id===r.paidBy);
    const card = document.createElement('div');
    card.className = 'receipt-card';
    card.innerHTML = `
      <div class="card-top">
        <span class="card-title">${escapeHtml(r.label || 'Untitled receipt')}</span>
        <span class="card-amount">${fmt(r.total||0)}</span>
      </div>
      <div class="card-sub">${r.date || ''} · ${r.mode==='even' ? 'split evenly' : 'itemized'}</div>
      <div class="card-badges">
        ${payer ? `<span class="badge" style="background:${payer.color}">paid by ${escapeHtml(payer.name)}</span>` : `<span class="badge outline">no payer set</span>`}
      </div>
    `;
    card.addEventListener('click', ()=>{ openReceiptEditor(r.id); });
    rList.appendChild(card);
  });

  renderBalances(trip);
}

$('newParticipantBtn').addEventListener('click', ()=>{
  const trip = getTrip(currentTripId);
  const name = $('newParticipantInput').value.trim();
  if(!name || !trip) return;
  const color = PALETTE[trip.participants.length % PALETTE.length];
  trip.participants.push({ id:uid(), name, color });
  $('newParticipantInput').value = '';
  saveTrips();
  renderTripScreen();
});
$('newParticipantInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('newParticipantBtn').click(); } });

$('newReceiptBtn').addEventListener('click', ()=> openReceiptEditor(null));

// ---- balances & settlement ----
function renderBalances(trip){
  const balances = trip.participants.map(p=>{
    let owed = 0, paid = 0;
    trip.receipts.forEach(r=>{
      owed += (r.perPersonOwed && r.perPersonOwed[p.id]) || 0;
      if(r.paidBy===p.id) paid += (r.total||0);
    });
    return { id:p.id, name:p.name, color:p.color, owed, paid, net: paid - owed };
  });

  const bList = $('balancesList');
  bList.innerHTML = '';
  if(trip.participants.length===0){
    bList.innerHTML = '<div class="empty-note">Add families to see balances.</div>';
    $('settleBlock').innerHTML = '';
    return;
  }
  balances.forEach(b=>{
    const row = document.createElement('div');
    row.className = 'balance-row';
    const netClass = b.net > 0.005 ? 'pos' : (b.net < -0.005 ? 'neg' : '');
    const netLabel = b.net > 0.005 ? 'is owed' : (b.net < -0.005 ? 'owes' : 'settled');
    row.innerHTML = `
      <span class="avatar sm" style="background:${b.color}">${initials(b.name)}</span>
      <div style="flex:1;">
        <div class="balance-name">${escapeHtml(b.name)}</div>
        <div class="balance-sub">paid ${fmt(b.paid)} · share ${fmt(b.owed)}</div>
      </div>
      <div>
        <div class="balance-amt ${netClass}">${fmt(Math.abs(b.net))}</div>
        <div class="balance-sub" style="text-align:right;">${netLabel}</div>
      </div>
    `;
    bList.appendChild(row);
  });

  // settlement suggestions
  const settle = $('settleBlock');
  const creditors = balances.filter(b=>b.net>0.005).map(b=>({...b})).sort((a,b2)=>b2.net-a.net);
  const debtors = balances.filter(b=>b.net<-0.005).map(b=>({...b, net:-b.net})).sort((a,b2)=>b2.net-a.net);
  const moves = [];
  let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const amt = Math.min(debtors[i].net, creditors[j].net);
    if(amt>0.005) moves.push({from:debtors[i].name, to:creditors[j].name, amount:amt});
    debtors[i].net -= amt; creditors[j].net -= amt;
    if(debtors[i].net<0.005) i++;
    if(creditors[j].net<0.005) j++;
  }
  if(moves.length===0){
    settle.innerHTML = balances.length ? '<div class="empty-note">Everyone is settled up.</div>' : '';
  } else {
    settle.innerHTML = '<div class="label-row" style="margin-top:6px;"><span>to settle up</span></div>' +
      moves.map(m=>`<div class="settle-row">${escapeHtml(m.from)} <span class="arrow">→</span> ${escapeHtml(m.to)} <b style="margin-left:auto;">${fmt(m.amount)}</b></div>`).join('');
  }
}

// ================= RECEIPT EDITOR =================
function blankReceipt(){
  return { id:uid(), label:'', date:new Date().toISOString().slice(0,10), paidBy:null, mode:'itemized',
    items:[], evenParticipants:[], tax:0, tip:0, evenTotal:0, subtotal:0, total:0, perPersonOwed:{} };
}

function openReceiptEditor(receiptId){
  const trip = getTrip(currentTripId);
  currentReceiptId = receiptId;
  if(receiptId){
    const r = trip.receipts.find(x=>x.id===receiptId);
    draftReceipt = JSON.parse(JSON.stringify(r));
  } else {
    draftReceipt = blankReceipt();
    // default paidBy / even-split participants to everyone in the trip
    draftReceipt.evenParticipants = trip.participants.map(p=>p.id);
  }
  receiptImageB64 = null; receiptImageMedia = null;
  $('thumbArea').classList.add('hidden');
  $('errorLine').classList.add('hidden');
  $('statusLine').classList.add('hidden');
  $('validationMsg').classList.add('hidden');
  $('deleteReceiptBtn').classList.toggle('hidden', !receiptId);
  renderReceiptEditor();
  showScreen('screen-receipt');
}

function renderReceiptEditor(){
  const trip = getTrip(currentTripId);
  $('receiptLabel').value = draftReceipt.label;
  $('receiptDate').value = draftReceipt.date;
  $('taxInput').value = (draftReceipt.tax||0).toFixed(2);
  $('tipInput').value = (draftReceipt.tip||0).toFixed(2);
  $('evenTotalInput').value = draftReceipt.evenTotal ? draftReceipt.evenTotal.toFixed(2) : '';

  // paid-by chips
  const pbStrip = $('paidByStrip');
  pbStrip.innerHTML = '';
  if(trip.participants.length===0){
    pbStrip.innerHTML = '<div class="empty-note">Add families to this trip first.</div>';
  }
  trip.participants.forEach(p=>{
    const chip = document.createElement('button');
    const active = draftReceipt.paidBy === p.id;
    chip.type='button';
    chip.className = 'chip' + (active?' active':'');
    chip.style.borderColor = p.color;
    if(active) chip.style.background = p.color;
    chip.innerHTML = `<span class="dot" style="color:${p.color}"></span>${escapeHtml(p.name)}`;
    chip.addEventListener('click', ()=>{ draftReceipt.paidBy = p.id; renderReceiptEditor(); });
    pbStrip.appendChild(chip);
  });

  // mode toggle
  $('modeItemizedBtn').classList.toggle('active', draftReceipt.mode==='itemized');
  $('modeEvenBtn').classList.toggle('active', draftReceipt.mode==='even');
  $('itemizedBlock').classList.toggle('hidden', draftReceipt.mode!=='itemized');
  $('evenBlock').classList.toggle('hidden', draftReceipt.mode!=='even');

  renderItemsList();
  renderEvenParticipants();
  updateItemizedTotals();
  updateEvenNote();
}

$('modeItemizedBtn').addEventListener('click', ()=>{ draftReceipt.mode='itemized'; renderReceiptEditor(); });
$('modeEvenBtn').addEventListener('click', ()=>{ draftReceipt.mode='even'; renderReceiptEditor(); });

$('receiptLabel').addEventListener('input', e=> draftReceipt.label = e.target.value);
$('receiptDate').addEventListener('input', e=> draftReceipt.date = e.target.value);

// ---- itemized ----
function renderItemsList(){
  const trip = getTrip(currentTripId);
  const list = $('itemsList');
  list.innerHTML = '';
  if(draftReceipt.items.length===0){
    list.innerHTML = '<div class="empty-note">No items yet — add one by hand, or photograph the receipt.</div>';
  }
  draftReceipt.items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'item-row';
    const top = document.createElement('div');
    top.className = 'item-top';

    const nameInput = document.createElement('input');
    nameInput.className='item-name'; nameInput.value = item.name;
    nameInput.addEventListener('input', ()=>{ item.name = nameInput.value; });

    const priceInput = document.createElement('input');
    priceInput.className='item-price'; priceInput.type='number'; priceInput.step='0.01';
    priceInput.value = item.price.toFixed(2);
    priceInput.addEventListener('input', ()=>{ item.price = Number(priceInput.value)||0; updateItemizedTotals(); });

    const delBtn = document.createElement('button');
    delBtn.className='item-del'; delBtn.textContent='✕';
    delBtn.addEventListener('click', ()=>{ draftReceipt.items = draftReceipt.items.filter(i=>i.id!==item.id); renderItemsList(); updateItemizedTotals(); });

    top.appendChild(nameInput); top.appendChild(priceInput); top.appendChild(delBtn);
    row.appendChild(top);

    const chips = document.createElement('div');
    chips.className='chips';
    if(trip.participants.length===0){
      chips.innerHTML = '<div class="empty-note">add families to assign this</div>';
    } else {
      trip.participants.forEach(p=>{
        const chip = document.createElement('button');
        const active = item.assignedTo.includes(p.id);
        chip.type='button';
        chip.className = 'chip' + (active?' active':'');
        chip.style.borderColor = p.color;
        if(active) chip.style.background = p.color;
        chip.innerHTML = `<span class="dot" style="color:${p.color}"></span>${escapeHtml(p.name)}`;
        chip.addEventListener('click', ()=>{
          if(active) item.assignedTo = item.assignedTo.filter(id=>id!==p.id);
          else item.assignedTo.push(p.id);
          renderItemsList();
        });
        chips.appendChild(chip);
      });
    }
    row.appendChild(chips);
    list.appendChild(row);
  });
}

$('addItemBtn').addEventListener('click', ()=>{
  draftReceipt.items.push({ id:uid(), name:'New item', price:0, assignedTo:[] });
  renderItemsList(); updateItemizedTotals();
});

function itemizedSubtotal(){ return draftReceipt.items.reduce((s,i)=>s+i.price,0); }
function updateItemizedTotals(){
  const sub = itemizedSubtotal();
  const tax = Number($('taxInput').value)||0;
  const tip = Number($('tipInput').value)||0;
  $('subtotalDisplay').textContent = fmt(sub);
  $('itemizedTotalDisplay').textContent = fmt(sub+tax+tip);
}
$('taxInput').addEventListener('input', ()=>{ draftReceipt.tax = Number($('taxInput').value)||0; updateItemizedTotals(); });
$('tipInput').addEventListener('input', ()=>{ draftReceipt.tip = Number($('tipInput').value)||0; updateItemizedTotals(); });

// ---- even split ----
function renderEvenParticipants(){
  const trip = getTrip(currentTripId);
  const strip = $('evenParticipantsStrip');
  strip.innerHTML = '';
  if(trip.participants.length===0){
    strip.innerHTML = '<div class="empty-note">Add families to this trip first.</div>';
    return;
  }
  trip.participants.forEach(p=>{
    const active = draftReceipt.evenParticipants.includes(p.id);
    const chip = document.createElement('button');
    chip.type='button';
    chip.className = 'chip' + (active?' active':'');
    chip.style.borderColor = p.color;
    if(active) chip.style.background = p.color;
    chip.innerHTML = `<span class="dot" style="color:${p.color}"></span>${escapeHtml(p.name)}`;
    chip.addEventListener('click', ()=>{
      if(active) draftReceipt.evenParticipants = draftReceipt.evenParticipants.filter(id=>id!==p.id);
      else draftReceipt.evenParticipants.push(p.id);
      renderEvenParticipants(); updateEvenNote();
    });
    strip.appendChild(chip);
  });
}
$('evenTotalInput').addEventListener('input', ()=>{ draftReceipt.evenTotal = Number($('evenTotalInput').value)||0; updateEvenNote(); });
function updateEvenNote(){
  const n = draftReceipt.evenParticipants.length;
  const total = Number($('evenTotalInput').value)||0;
  $('perHeadNote').textContent = n>0 ? `${fmt(total/n)} per family (${n} sharing)` : 'Select who is sharing this bill.';
}

// ---- capture / OCR (shared) ----
// Note: the slot and retake control are native <label for="fileInput"> elements,
// which reliably opens the file/camera picker even inside sandboxed in-app browsers
// (a JS-triggered .click() on the hidden input can silently fail in those contexts).
$('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    receiptImageMedia = file.type || 'image/jpeg';
    receiptImageB64 = dataUrl.split(',')[1];
    $('thumbImg').src = dataUrl;
    $('thumbArea').classList.remove('hidden');
    $('thumbInfo').textContent = 'Reading this receipt now...';
    $('errorLine').classList.add('hidden');
    await processReceipt();
  };
  reader.readAsDataURL(file);
});

async function processReceipt(){
  $('statusLine').classList.remove('hidden');
  $('statusText').innerHTML = 'Reading receipt<span class="dots"></span>';
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{
          role:'user',
          content:[
            { type:'image', source:{ type:'base64', media_type: receiptImageMedia, data: receiptImageB64 } },
            { type:'text', text:'This is a photo of a receipt (dining or grocery). Extract every purchased line item with its name and price (before tax and tip), plus the subtotal, tax, tip, and total if printed. Report all amounts as plain numbers only, without currency symbols. Respond with ONLY raw JSON, no markdown fences, no commentary, in exactly this shape: {"items":[{"name":"string","price":0.00}],"subtotal":0.00,"tax":0.00,"tip":0.00,"total":0.00}. If tip is not printed, use 0. If subtotal is not printed, sum the items. Make your best reading even if some text is blurry.' }
          ]
        }]
      })
    });
    const data = await resp.json();
    const textBlock = (data.content || []).find(b=>b.type==='text');
    if(!textBlock) throw new Error('No response');
    let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(clean);

    draftReceipt.items = (parsed.items||[]).map(it => ({ id:uid(), name: it.name||'Item', price:Number(it.price)||0, assignedTo:[] }));
    draftReceipt.tax = Number(parsed.tax)||0;
    draftReceipt.tip = Number(parsed.tip)||0;
    const total = Number(parsed.total) || (Number(parsed.subtotal)||itemizedSubtotal()) + draftReceipt.tax + draftReceipt.tip;
    draftReceipt.evenTotal = total;
    if(!draftReceipt.label){
      draftReceipt.label = (parsed.items && parsed.items.length) ? '' : '';
    }

    $('thumbInfo').textContent = `Found ${draftReceipt.items.length} item${draftReceipt.items.length===1?'':'s'}.`;
    $('statusLine').classList.add('hidden');
    renderReceiptEditor();
  }catch(err){
    $('statusLine').classList.add('hidden');
    $('errorLine').classList.remove('hidden');
    $('errorLine').textContent = "Couldn't read that clearly — enter items or the total by hand below.";
  }
}

// ---- save / delete ----
function recomputeReceipt(r){
  if(r.mode==='itemized'){
    const sub = r.items.reduce((s,i)=>s+i.price,0);
    r.subtotal = sub;
    r.total = sub + (r.tax||0) + (r.tip||0);
    const owed = {};
    r.items.forEach(item=>{
      if(item.assignedTo.length===0) return;
      const share = item.price / item.assignedTo.length;
      item.assignedTo.forEach(pid => owed[pid] = (owed[pid]||0) + share);
    });
    if(sub>0){
      Object.keys(owed).forEach(pid=>{
        const fraction = owed[pid]/sub;
        owed[pid] += fraction * ((r.tax||0)+(r.tip||0));
      });
    }
    r.perPersonOwed = owed;
  } else {
    r.subtotal = r.evenTotal||0;
    r.total = r.evenTotal||0;
    const owed = {};
    const n = (r.evenParticipants||[]).length;
    if(n>0){
      const share = (r.evenTotal||0)/n;
      r.evenParticipants.forEach(pid => owed[pid]=share);
    }
    r.perPersonOwed = owed;
  }
}

$('saveReceiptBtn').addEventListener('click', ()=>{
  const trip = getTrip(currentTripId);
  const msg = $('validationMsg');
  if(!draftReceipt.paidBy){ msg.textContent='Pick who paid this receipt.'; msg.classList.remove('hidden'); return; }
  if(draftReceipt.mode==='even' && draftReceipt.evenParticipants.length===0){ msg.textContent='Pick at least one family to split this evenly with.'; msg.classList.remove('hidden'); return; }
  if(!draftReceipt.label){ draftReceipt.label = draftReceipt.mode==='even' ? 'Shared expense' : 'Receipt'; }

  recomputeReceipt(draftReceipt);

  const idx = trip.receipts.findIndex(r=>r.id===draftReceipt.id);
  if(idx>=0) trip.receipts[idx] = draftReceipt; else trip.receipts.push(draftReceipt);
  saveTrips();
  renderTripScreen();
  showScreen('screen-trip');
});

function deleteCurrentReceipt(){
  if(!confirm('Delete this receipt?')) return;
  const trip = getTrip(currentTripId);
  trip.receipts = trip.receipts.filter(r=>r.id!==currentReceiptId);
  saveTrips();
  renderTripScreen();
  showScreen('screen-trip');
}

// ---- utils ----
function initials(name){ return (name||'').trim().slice(0,2).toUpperCase() || '??'; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

renderTripsScreen();
showScreen('screen-trips');
</script>
